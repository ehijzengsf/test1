<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Vang het Blokje!</title>
    <style>
        /* Dit zorgt ervoor dat alles netjes in het midden staat */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
        }

        /* Het speelveld */
        #speelveld {
            width: 400px;
            height: 400px;
            background-color: white;
            border: 3px solid black;
            margin: 20px auto; /* Centreert het vak */
            position: relative; /* Nodig zodat het blokje hierbinnen blijft */
        }

        /* Het rode blokje waar je op moet klikken */
        #blokje {
            width: 50px;
            height: 50px;
            background-color: red;
            position: absolute; /* Hiermee kunnen we het blokje verplaatsen */
            top: 100px;
            left: 100px;
            cursor: pointer; /* Verandert de muis in een handje */
        }
    </style>
</head>
<body>

    <h1>Vang het rode blokje!</h1>
    <h2>Score: <span id="score">0</span></h2>

   <div id="speelveld">
        <!-- Let op: 'onclick' is hier weggehaald -->
        <div id="blokje"></div>
    </div>

    <script>
        let score = 0;
        let blokje = document.getElementById("blokje");

        // We koppelen de klik nu via JavaScript in plaats van in de HTML
        blokje.addEventListener("click", function() {
            score = score + 1;
            document.getElementById("score").innerText = score;

            let nieuweX = Math.floor(Math.random() * 350);
            let nieuweY = Math.floor(Math.random() * 350);

            blokje.style.left = nieuweX + "px";
            blokje.style.top = nieuweY + "px";
        });
    </script>

</body>
</html>
