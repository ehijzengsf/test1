<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Vang het Blokje!</title>
    <style>
        /* Dit zorgt ervoor dat alles netjes in het midden staat */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
        }

        /* Het speelveld */
        #speelveld {
            width: 400px;
            height: 400px;
            background-color: white;
            border: 3px solid black;
            margin: 20px auto; /* Centreert het vak */
            position: relative; /* Nodig zodat het blokje hierbinnen blijft */
        }

        /* Het rode blokje waar je op moet klikken */
        #blokje {
            width: 50px;
            height: 50px;
            background-color: red;
            position: absolute; /* Hiermee kunnen we het blokje verplaatsen */
            top: 100px;
            left: 100px;
            cursor: pointer; /* Verandert de muis in een handje */
        }
    </style>
</head>
<body>

    <h1>Vang het rode blokje!</h1>
    <h2>Score: <span id="score">0</span></h2>

    <!-- Het speelveld met daarin het blokje -->
    <div id="speelveld">
        <div id="blokje" onclick="raakGeklikt()"></div>
    </div>

    <script>
        // 1. We maken een variabele aan om de score bij te houden
        let score = 0;

        // 2. Deze functie wordt uitgevoerd als je op het blokje klikt
        function raakGeklikt() {
            // Verhoog de score met 1
            score = score + 1;
            
            // Laat de nieuwe score zien op het scherm
            document.getElementById("score").innerText = score;

            // Bedenk een willekeurige nieuwe plek (tussen 0 en 350 pixels)
            // 350 omdat het veld 400 is en het blokje zelf 50 breed is
            let nieuweX = Math.floor(Math.random() * 350);
            let nieuweY = Math.floor(Math.random() * 350);

            // Verplaats het blokje naar de nieuwe plek
            let blokje = document.getElementById("blokje");
            blokje.style.left = nieuweX + "px";
            blokje.style.top = nieuweY + "px";
        }
    </script>

</body>
</html>
